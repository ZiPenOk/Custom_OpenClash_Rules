port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
proxy-providers:
  ALL:
    type: http
    url: "订阅地址"
    interval: 3600
    proxy: DIRECT
    path: ./rule_provider/ALL.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 600
    override:
      skip-cert-verify: true
      udp: true
proxy-groups:
