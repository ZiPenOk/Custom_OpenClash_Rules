    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - ALL
    filter: "(\U0001F1ED\U0001F1F0|港|\\bHK(?:[-_ ]?\\d+(?:[-_ ]?[A-Za-z]{2,})?)?\\b|hk|Hong
      Kong|HongKong|hongkong|HONG KONG|HONGKONG|深港|HKG|九龙|Kowloon|新界|沙田|荃湾|葵涌)"
  - name: "日本节点"
