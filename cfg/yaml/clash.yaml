    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - ALL
    filter: "(\U0001F1EF\U0001F1F5|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|\\bJP(?:[-_ ]?\\d+(?:[-_
