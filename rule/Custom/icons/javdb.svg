<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 镂空遮罩：白色显示，黑色裁剪 -->
    <mask id="javdb-mask">
      <rect x="0" y="64" width="128" height="64" fill="white" />
      <text x="50%" y="96" dominant-baseline="central" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="56" fill="black">DB</text>
    </mask>
  </defs>

  <!-- 上行：Jav（透明背景，深灰字） -->
  <text x="50%" y="32" dominant-baseline="central" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="57" fill="#696969">Jav</text>

  <!-- 下行：蓝色背景块 + 镂空 DB -->
  <rect x="0" y="64" width="128" height="64" fill="#4169E1" mask="url(#javdb-mask)" />
</svg>
